<body class="landing-page">

  <canvas id="particles-canvas"></canvas>

  <div class="hero-card">
    <div class="hero-logo">TeamDraft.lol</div>
    <!-- Firebase 미설정 시 경고 (JS에서 토글) -->
    <div class="firebase-warning hidden" id="firebase-warning">
      ⚠️ Firebase 설정이 필요합니다.<br>
      <code>js/firebase-config.js</code> 파일을 열어<br>
      본인 프로젝트 값으로 교체해주세요.
      <br><br>
      <a href="https://console.firebase.google.com" target="_blank" style="color:#ffa040; text-decoration:underline;">
        Firebase Console 열기 →
      </a>
    </div>

    <button id="create-room-btn" class="btn btn-gold btn-full btn-large">
      방 만들기
    </button>

    <p style="margin-top: 16px; font-size: 0.78rem; color: var(--text-dim);">
      방을 만들면 링크가 생성됩니다. 참가자들에게 공유하세요.
    </p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <script>
    // ─── 파티클 배경 애니메이션 ────────────────────────────────────
    (function () {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      function createParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          alpha: Math.random() * 0.4 + 0.1,
          gold: Math.random() > 0.6
        };
      }

      for (let i = 0; i < 120; i++) particles.push(createParticle());

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = canvas.width;
          if (p.x > canvas.width) p.x = 0;
          if (p.y < 0) p.y = canvas.height;
          if (p.y > canvas.height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.gold
            ? `rgba(200, 155, 60, ${p.alpha})`
            : `rgba(100, 130, 200, ${p.alpha})`;
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }
      animate();
    })();

    // ─── 방 생성 로직 ──────────────────────────────────────────────
    function generateRoomId() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      return Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    document.getElementById('create-room-btn').addEventListener('click', async () => {
      // Firebase 초기화 확인
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
      } catch (e) {
        document.getElementById('firebase-warning').classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('create-room-btn');
      btn.disabled = true;
      btn.textContent = '방 생성 중...';

      const roomId = generateRoomId();
      const hostToken = Math.random().toString(36).substring(2) + Date.now().toString(36);

      try {
        const roomRef = firebase.database().ref(`rooms/${roomId}`);
        await roomRef.set({
          meta: {
            createdAt: firebase.database.ServerValue.TIMESTAMP,
            expiresAt: Date.now() + (24 * 60 * 60 * 1000), // 24시간 후 만료
            hostToken: hostToken
          }
        });

        // 방장 토큰 저장
        localStorage.setItem(`hostToken_${roomId}`, hostToken);

        // 방 페이지로 이동
        location.href = `room.html?room=${roomId}`;
      } catch (err) {
        console.error(err);
        if (err.message && (err.message.includes('PERMISSION_DENIED') || err.message.includes('permission_denied'))) {
          alert('❌ Firebase 권한 오류 (PERMISSION_DENIED)\n\nFirebase Console (https://console.firebase.google.com)에 접속하여:\nRealtime Database -> [규칙] 탭에서 rules를 아래와 같이 변경해주세요:\n\n{\n  "rules": {\n    ".read": true,\n    ".write": true\n  }\n}');
        } else {
          alert('방 생성에 실패했습니다. Firebase 설정을 확인해주세요.\n오류: ' + err.message);
        }
        btn.disabled = false;
        btn.textContent = '방 만들기';
      }
    });
  </script>
</body>

</html>
